name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, gd, exif, iconv
          coverage: none
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist
      - name: Prepare isolated application
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
      - name: Install Node dependencies
        run: npm ci
      - name: Composer security audit
        run: composer audit
      - name: Node security audit
        run: npm audit --audit-level=high
      - name: Client production build
        run: npm run build
      - name: SSR production build
        run: npm run build:ssr
      - name: PHP feature suite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: composer test
