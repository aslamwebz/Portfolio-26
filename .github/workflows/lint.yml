name: Lint
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, gd, exif, iconv
          coverage: none
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist
      - name: Prepare isolated application
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
      - name: Install Node dependencies
        run: npm ci
      - name: Generate route types before static checks
        run: php artisan wayfinder:generate --with-form --no-interaction
      - name: PHP style
        run: php vendor/bin/pint --test
      - name: JavaScript lint (read only)
        run: npm run lint -- --no-fix
      - name: TypeScript
        run: npm run types
      - name: Formatting
        run: npm run format:check
